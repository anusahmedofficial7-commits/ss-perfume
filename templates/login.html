{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block extra_css %}

<style>

.login-card{
    max-width:500px;
    margin:60px auto;
    border:none;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.login-header{
    background:#111;
    color:#d4af37;
    text-align:center;
    padding:25px;
    border-radius:20px 20px 0 0;
}

.btn-login{
    background:#d4af37;
    color:#000;
    font-weight:bold;
}

.btn-login:hover{
    background:#b8860b;
    color:#fff;
}

</style>

{% endblock %}

{% block content %}

<div class="card login-card">

<div class="login-header">

<h2>🔐 Login</h2>

<p>Welcome Back</p>

</div>

<div class="card-body p-4">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
name="username"
class="form-control"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

<button
type="submit"
class="btn btn-login w-100">

Login

</button>

</form>

<hr>

<p class="text-center">

Don't have an account?

<a href="{% url 'signup' %}">

Create Account

</a>

</p>

</div>

</div>

{% endblock %}
